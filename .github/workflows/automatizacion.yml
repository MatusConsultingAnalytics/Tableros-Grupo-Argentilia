name: Actualizar Tablero

on:
  schedule:
    # 19:47 UTC = 13:47 CDMX (respaldo; GitHub puede retrasar corridas programadas).
    # El disparo principal de las 14:00 se hace por workflow_dispatch desde una tarea programada.
    - cron: '47 19 * * 1-5'
  workflow_dispatch:

concurrency:
  group: tablero
  cancel-in-progress: false

jobs:
  # El cron de respaldo puede llegar con horas de retraso (p. ej. 13/10 corrió a las 17:26 en vez de 13:47)
  # y sobrescribir la actualización de las 14:00. Si ya hubo una actualización manual/programada exitosa hoy,
  # la corrida de respaldo se omite; si no la hubo, se ejecuta normalmente.
  verificar:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      ejecutar: ${{ steps.revisar.outputs.ejecutar }}
    steps:
      - id: revisar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "ejecutar=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          HOY=$(TZ=America/Mexico_City date +%Y-%m-%d)
          DESDE="${HOY}T06:00:00Z"   # 00:00 CDMX (UTC-6 fijo)
          N=$(gh api -X GET "repos/${{ github.repository }}/actions/workflows/automatizacion.yml/runs" \
                -f event=workflow_dispatch -f status=success -f created=">=$DESDE" --jq '.total_count')
          if [ "${N:-0}" -gt 0 ]; then
            echo "::notice::Ya hubo $N actualización(es) exitosa(s) hoy ($HOY). Se omite el respaldo programado."
            echo "ejecutar=false" >> "$GITHUB_OUTPUT"
          else
            echo "ejecutar=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: verificar
    if: needs.verificar.outputs.ejecutar == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Seguridad: nunca publicar el tablero sin contraseña
      - name: Verificar secretos
        env:
          TABLERO_PASSWORD: ${{ secrets.TABLERO_PASSWORD }}
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: |
          if [ -z "$TABLERO_PASSWORD" ]; then
            echo "::error::Falta el secreto TABLERO_PASSWORD. No se publica el tablero sin contraseña."
            exit 1
          fi
          if [ -z "$GDRIVE_SA_KEY" ]; then
            echo "::warning::Falta el secreto GDRIVE_SA_KEY: la pestaña Rentabilidad mostrará 'no disponible'."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install pandas openpyxl requests google-auth

      - name: Generar tablero
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          EF_FOLDER_ID: '1jDKGW4dhuy9JKvZ2g8Zuwx17qeE7kBcT'
        run: python3 generar_tablero.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Cifra el tablero: sin la contraseña el contenido es ilegible, incluso en el código fuente.
      - name: Cifrar con contraseña
        env:
          TABLERO_PASSWORD: ${{ secrets.TABLERO_PASSWORD }}
        run: |
          npx --yes staticrypt@3.5.4 index.html \
            -p "$TABLERO_PASSWORD" --short -d public \
            -s 8b94054bfa6ae5578dd11ee9ffc0cb1f --config false --remember 7 \
            --template-title "Tablero Ejecutivo · Grupo Gastronómico Argentilia" \
            --template-instructions "Información confidencial de Matus Consulting. Ingresa la contraseña para ver el tablero." \
            --template-placeholder "Contraseña" \
            --template-button "Entrar" \
            --template-remember "Recordarme en este equipo (7 días)" \
            --template-error "Contraseña incorrecta" \
            --template-toggle-show "Mostrar contraseña" \
            --template-toggle-hide "Ocultar contraseña" \
            --template-color-primary "#ED2E38" \
            --template-color-secondary "#F4F2F0"
          touch public/.nojekyll
          if grep -q "Rentabilidad" public/index.html; then
            echo "::error::El archivo publicado contiene texto sin cifrar. Se detiene la publicación."
            exit 1
          fi

      # Solo se publica la carpeta cifrada; force_orphan borra el historial anterior sin cifrar.
      - name: Publicar tablero
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
